<ion-content class="fondo">
  <ion-card class="card-formulario">
    <div class="perfil-container">
      <img #fotoPerfil class="foto-perfil" src="assets/icon/perfil.png" alt="Foto de perfil" />
    </div>

    <form>
      <ion-item>
        <ion-label position="floating">Nombre</ion-label>

      </ion-item>

      <ion-item>
        <ion-label position="floating">Apellido</ion-label>

      </ion-item>

      <ion-item>
        <ion-label position="floating">Correo electrónico</ion-label>

      </ion-item>

      <ion-item>
        <ion-label position="floating">Fecha de nacimiento</ion-label>
        
      </ion-item>

      <ion-item>
        <ion-label>Educación</ion-label>

      </ion-item>

      <ion-button expand="block" color="success" (click)="guardar()">Guardar</ion-button>
      
    </form>
  </ion-card>
</ion-content>
