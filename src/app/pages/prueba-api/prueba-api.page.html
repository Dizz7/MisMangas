<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>prueba-api</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
 <ion-list>
  <ion-item>
    <ion-label>
      <h2>Prueba de API</h2>
      <p>Esta página es una prueba para verificar el funcionamiento de la API.</p>
    </ion-label>
  </ion-item>
  <ion-item *ngFor="let user of users">
    <ion-label>
      <h3>Nombre: {{ user.name }}</h3>
      <p>Email: {{ user.email }}</p>
    </ion-label>
    <ion-button color="warning" (click)="editarUsuario(user)">Editar</ion-button>
    <ion-button color="danger" (click)="eliminarUsuario(user.id)">Eliminar</ion-button>
  </ion-item>
 </ion-list>


 <!-- Formulario para agregar un nuevo usuario-->

 <ion-item>
  <ion-label position="floating">Nombre</ion-label>
  <ion-input [(ngModel)]="nuevoUsuario.name" placeholder="Ingrese el nombre"></ion-input>
 </ion-item>
  <ion-item>
    <ion-label position="floating">Email</ion-label>
    <ion-input [(ngModel)]="nuevoUsuario.email" placeholder="Ingrese el email"></ion-input>
  </ion-item>
  <ion-button expand="full" (click)="agregarUsuario()">
    {{ editando ? 'Actualizar Usuario' : 'Agregar Usuario' }}
  </ion-button>

</ion-content>
