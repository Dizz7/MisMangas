<ion-content [fullscreen]="true">
  <ion-card id="main" color="light">
    
    <ion-card-header>
      <!--<img #fotoLogo src="/assets/images/logo.png" alt="Logo" class="logo" />-->
    </ion-card-header>
  
    <ion-list>

    <ion-card-content>
        
        <h1> Mis Tareas ✨</h1>
      </ion-card-content>

      <ion-item>
        <ion-label class="label" position="stacked">¿Qué harémos hoy?</ion-label>
        <ion-input [(ngModel)]="tarea" placeholder="" type="text"></ion-input>
      </ion-item>


      <div class="ion-text-center">
        <ion-button class="add-button" (click)="add()">Agregar a la lista</ion-button>
        
      </div>



    </ion-list>
  

  </ion-card>

  <ion-footer>
    <ion-toolbar color="light">
      <ion-title class="ion-text-center" size="small">
        <app-footer></app-footer> <!--componente footer-->
      </ion-title>
    </ion-toolbar>
  </ion-footer>

</ion-content>
