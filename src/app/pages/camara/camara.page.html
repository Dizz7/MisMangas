<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Cámara</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-button expand="block" (click)="takePicture()">Tomar Foto</ion-button>

  <div *ngIf="photo" style="margin-top: 20px; text-align: center;">
    <img [src]="photo" alt="Foto tomada" style="max-width: 100%; border-radius: 10px;" />
  </div>
</ion-content>
